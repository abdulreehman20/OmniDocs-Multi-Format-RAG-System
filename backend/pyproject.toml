[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdulreehman20", email = "abdulreehman20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.119",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.0",
    "inngest>=0.5.19",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=7.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.10.0",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "ragas>=0.4.3",
    "sentry-sdk>=2.73.0",
    "sqlmodel>=0.0.48",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
]
[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["I001", "UP007", "UP035", "E501"]
"test.py" = ["E501"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

